# Publishes the seven npm packages. Invoked by release.yml (generated by dist),
# so the GitHub Release — and therefore the archives this repackages — already
# exist.
name: Publish (npm)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      VERSION: ${{ fromJson(inputs.plan).announcement_tag_is_implicit && '' || fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJson(inputs.plan).announcement_tag }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Fetch the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --pattern '*.tar.gz' --pattern '*.zip'
          ls -la artifacts

      - name: Write the dist plan
        run: printf '%s' '${{ inputs.plan }}' > plan.json

      - name: Generate the package trees
        run: nix develop --command node scripts/build-npm-packages.js --plan plan.json --artifacts-dir artifacts --out-dir npm/.output

      # The generated manifests all take their version from the plan, so they
      # cannot drift from each other by construction. This asserts it anyway:
      # the check is nearly free, and a silent mismatch here would publish an
      # entry package whose optionalDependencies point at versions that do not
      # exist.
      - name: Assert every manifest agrees on one version
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          count=0
          for manifest in npm/.output/*/package.json; do
            actual=$(nix develop --command node -e "process.stdout.write(require('./$manifest').version)")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$manifest is $actual, expected $expected"
              exit 1
            fi
            count=$((count + 1))
          done
          [ "$count" -eq 7 ] || { echo "::error::expected 7 packages, found $count"; exit 1; }
          echo "all $count manifests at $expected"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

          publish() {
            local dir="$1"
            if out=$(cd "$dir" && npm publish --access public 2>&1); then
              echo "$out"; echo "published $dir"
            else
              echo "$out"
              # As with crates.io: an already-published version means a previous
              # run got this far, so re-running should complete the release
              # rather than fail on work already done.
              if grep -qiE 'E409|cannot publish over|already exists' <<<"$out"; then
                echo "already published $dir; treating as success"
              else
                return 1
              fi
            fi
          }

          # Platform packages first. The entry package's optionalDependencies
          # pin exact versions of these, so publishing it first would leave it
          # briefly installable and broken.
          for dir in npm/.output/adfc-*; do publish "$dir"; done
          publish npm/.output/adfc
