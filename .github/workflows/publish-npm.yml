# Publishes the seven npm packages. Invoked by release.yml (generated by dist),
# so the GitHub Release — and therefore the archives this repackages — already
# exist.
name: Publish (npm)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: each `npm publish` proves this job's identity over OIDC
    # instead of presenting a stored token.
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJson(inputs.plan).announcement_tag }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # OIDC publishing needs npm >= 11.5.1 on Node >= 22.14.0, and neither the
      # runner default nor the devShell's node is new enough. The npm upgrade is
      # separate because setup-node installs whichever npm that Node bundles.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          registry-url: https://registry.npmjs.org
      - name: Install an npm that can publish over OIDC
        run: |
          set -euo pipefail
          npm install -g npm@latest
          echo "node $(node --version), npm $(npm --version)"

      - name: Fetch the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --pattern '*.tar.gz' --pattern '*.zip'
          ls -la artifacts

      # Passed through the environment rather than interpolated into the
      # script: the plan carries free text derived from the changelog, and a
      # single apostrophe in it would close the shell quoting. One is present
      # already, so this is a live defect, not a precaution.
      - name: Write the dist plan
        env:
          PLAN: ${{ inputs.plan }}
        run: printf '%s' "$PLAN" > plan.json

      - name: Generate the package trees
        run: nix develop --command node scripts/build-npm-packages.js --plan plan.json --artifacts-dir artifacts --out-dir npm/.output

      # The generated manifests all take their version from the plan, so they
      # cannot drift from each other by construction. This asserts it anyway:
      # the check is nearly free, and a silent mismatch here would publish an
      # entry package whose optionalDependencies point at versions that do not
      # exist.
      - name: Assert every manifest agrees on one version
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          # packageDirs() knows the layout, including that scoped packages nest
          # a level; globbing here would silently miss them.
          mapfile -t dirs < <(nix develop --command node -e "
            console.log(require('./scripts/build-npm-packages.js').packageDirs('npm/.output').join('\n'))")
          for dir in "${dirs[@]}"; do
            actual=$(nix develop --command node -e "process.stdout.write(require('./$dir/package.json').version)")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$dir is $actual, expected $expected"
              exit 1
            fi
          done
          [ "${#dirs[@]}" -eq 7 ] || { echo "::error::expected 7 packages, found ${#dirs[@]}"; exit 1; }
          echo "all ${#dirs[@]} manifests at $expected"

      - name: Publish
        run: |
          set -euo pipefail
          # No token and no ~/.npmrc: each publish presents this job's OIDC
          # identity, which npm matches against the trusted publisher configured
          # on the package. The old `npm whoami` preflight is gone with it —
          # there is no account to mistake, and the failure it guarded against
          # (a token belonging to the wrong user) cannot occur.
          echo "publishing @amdevz over OIDC as node $(node --version), npm $(npm --version)"

          publish() {
            local dir="$1"
            if out=$(cd "$dir" && npm publish --access public 2>&1); then
              echo "$out"; echo "published $dir"
            else
              echo "$out"
              # As with crates.io: an already-published version means a previous
              # run got this far, so re-running should complete the release
              # rather than fail on work already done.
              if grep -qiE 'E409|cannot publish over|already exists' <<<"$out"; then
                echo "already published $dir; treating as success"
              else
                return 1
              fi
            fi
          }

          mapfile -t dirs < <(nix develop --command node -e "
            console.log(require('./scripts/build-npm-packages.js').packageDirs('npm/.output').join('\n'))")

          # The entry package publishes last: its optionalDependencies pin exact
          # versions of the platform packages, so the other order leaves it
          # briefly installable and broken.
          entry="npm/.output/@amdevz/adfc"
          for dir in "${dirs[@]}"; do
            [ "$dir" = "$entry" ] && continue
            publish "$dir"
          done
          publish "$entry"
