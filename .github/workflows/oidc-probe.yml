# TEMPORARY. Prints the OIDC claims a reusable workflow sees, so the trusted
# publisher on crates.io and npm can be registered against the right workflow
# filename instead of a guess. Delete once both are configured.
name: OIDC probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    uses: ./.github/workflows/oidc-probe-inner.yml
    permissions:
      contents: read
      id-token: write
