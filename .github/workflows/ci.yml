name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs inside the flake's devShell so CI and a local checkout use the same
  # rustc, rustfmt and clippy, pinned by flake.lock. The alternative,
  # dtolnay/rust-toolchain@stable, floats: this repo already lost a day to that
  # when a newer toolchain's 2024 style rules disagreed with an older one and
  # `cargo fmt --check` failed on an unmodified tree (see rustfmt.toml).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Caches ~/.cargo and target/ across runs. Nix supplies the toolchain;
      # this keeps the crate builds themselves incremental.
      - uses: Swatinem/rust-cache@v2
      # The same recipes a developer runs. Kept as separate steps rather than a
      # single `just check` so a failure names the gate that broke it in the
      # job summary; the recipes themselves are the single definition.
      - name: Format check
        run: nix develop --command just fmt-check
      - name: Lint
        run: nix develop --command just lint
      - name: Tests
        run: nix develop --command just test

  # Separate job so an advisory against a dependency is distinguishable at a
  # glance from a code failure, and so it still runs when the test job fails.
  # Left on rustsec/audit-check rather than the devShell: the action annotates
  # advisories inline on the PR, which a bare `cargo audit` run cannot do.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
