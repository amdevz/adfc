name: CI

on:
  push:
    branches: [main]
  pull_request:
  # An advisory can be published against dependencies that have not changed, so
  # the audit job needs a trigger that is not tied to a push.
  schedule:
    - cron: "0 6 * * 1"

# Superseded runs on the same ref are pointless once a newer commit exists.
# main is excluded: post-merge runs are the record of whether that commit is
# good, so cancelling them would leave gaps in that history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Runs inside the flake's devShell so CI and a local checkout use the same
  # rustc, rustfmt and clippy, pinned by flake.lock. The alternative,
  # dtolnay/rust-toolchain@stable, floats: this repo already lost a day to that
  # when a newer toolchain's 2024 style rules disagreed with an older one and
  # `cargo fmt --check` failed on an unmodified tree (see rustfmt.toml).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Caches ~/.cargo and target/ across runs. Nix supplies the toolchain;
      # this keeps the crate builds themselves incremental.
      - uses: Swatinem/rust-cache@v2
      # The same recipes a developer runs. Kept as separate steps rather than a
      # single `just check` so a failure names the gate that broke it in the
      # job summary; the recipes themselves are the single definition.
      - name: Format check
        run: nix develop --command just fmt-check
      - name: Lint
        run: nix develop --command just lint
      - name: Tests
        run: nix develop --command just test

  # Separate job so an advisory against a dependency is distinguishable at a
  # glance from a code failure, and so it still runs when the test job fails.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The RustSec advisory database is a ~46MB git clone, and fetching it
      # from scratch is what made this job take six minutes. Restored from
      # cache the fetch is an incremental delta and `cargo audit` itself runs
      # in under a second.
      #
      # The key is unique per run so every run writes back a fresher database;
      # restore-keys falls back to the most recent one. A stale cache cannot
      # hide a new advisory because cargo audit still fetches the delta before
      # scanning.
      - name: Cache advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.run_id }}
          restore-keys: advisory-db-
      # Same recipe a developer runs, using the cargo-audit in the devShell.
      - name: Audit
        run: nix develop --command just audit
