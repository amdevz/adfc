# TEMPORARY. See oidc-probe.yml. Deliberately mirrors the caller -> reusable
# shape of release.yml -> publish-crates.yml, because that shape is exactly what
# makes the claims ambiguous: `workflow_ref` names the caller and
# `job_workflow_ref` names this file.
name: OIDC probe (inner)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # Only the routing claims are printed. The token itself is never echoed.
      - name: Print the claims a registry would match on
        run: |
          set -euo pipefail
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" | jq -r '.value')
          payload=$(echo "$jwt" | cut -d. -f2)
          # base64url -> base64, padded
          payload=$(echo "$payload" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          echo "$payload" | base64 -d | jq '{repository, workflow_ref, job_workflow_ref, sub, ref}'
