# Publishes the crate. Invoked by release.yml (generated by dist), which
# guarantees the GitHub Release already exists before this runs.
#
# Ordered before the npm job in dist-workspace.toml deliberately: a crates.io
# version is irreversible — it can be yanked but never deleted — so it is the
# single publish worth doing while the fewest things have happened.
name: Publish (crates.io)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: crates.io hands back a 30-minute token in exchange for
    # this job's OIDC identity, so no long-lived registry token exists anywhere.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJson(inputs.plan).announcement_tag }}
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Revoked when the job ends, so a leaked log line is worth nothing minutes
      # later — the property a stored token cannot have.
      - name: Mint a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Re-running a completed release must be a no-op rather than an
          # error, so a run that failed partway through can be finished by
          # re-running it instead of burning a version number.
          if out=$(nix develop --command cargo publish --locked 2>&1); then
            echo "$out"
            echo "published"
          else
            echo "$out"
            if grep -qiE 'already (exists|uploaded)|crate version .* is already' <<<"$out"; then
              echo "already published; treating as success"
            else
              exit 1
            fi
          fi
