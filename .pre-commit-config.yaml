# pre-commit configuration (consumed by prek, the Rust drop-in)
# Schema: https://pre-commit.com/#pre-commit-configyaml---top-level
# Install: prek install --hook-type pre-commit --hook-type commit-msg

default_stages: [pre-commit]
fail_fast: false

repos:
  # General file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: mixed-line-ending
        args: ['--fix=lf']
      # Runs only on changed files, so this validates the vendored ADF schema
      # exactly when it is re-vendored - the one moment it could arrive
      # truncated or malformed.
      - id: check-json
        # tests/fixtures/malformed-schema.json is invalid on purpose: it is
        # what drives the CLI's "cannot parse schema" path, so a hook that
        # insists it parse would delete the test's reason for existing.
        exclude: ^tests/fixtures/malformed-schema\.json$

  # Conventional Commits validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Local hooks. These delegate to justfile recipes rather than spelling out
  # cargo invocations, so the hook, `just check` and CI cannot drift apart: the
  # recipe is the single definition of what each gate means.
  #
  # They need the devShell on PATH. The committed .envrc loads it via direnv on
  # entry; `nix develop` does the same without direnv. Everything comes from
  # flake.lock, so every contributor and CI run the identical toolchain.
  - repo: local
    hooks:
      - id: fmt-check
        name: just fmt-check
        # Style rules are pinned in rustfmt.toml (style_edition), so this is
        # stable across toolchains rather than whatever the local one prefers.
        entry: just fmt-check
        language: system
        types: [rust]
        pass_filenames: false

      - id: lint
        name: just lint
        # Pedantic matches how this crate has been linted since its first
        # commits; --all-targets covers tests as well as the library.
        entry: just lint
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true

      - id: test
        name: just test
        # Cheap here (sub-second) and the suite is the only thing proving the
        # emitted ADF still validates against the vendored schema.
        entry: just test
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true

      - id: test-node
        name: just test-node
        # The Rust hooks are gated on `types: [rust]`, so without this the
        # shim and packaging script would be committed ungated.
        entry: just test-node
        language: system
        files: \.(js|cjs|mjs)$
        pass_filenames: false
        require_serial: true
